<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Officer Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding: 40px; color: #2d3748; }
    .header { margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    #tickets-container { display: grid; gap: 20px; }
    .ticket { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #3182ce; }
    .ticket h3 { margin: 0 0 10px 0; color: #1a365d; }
    .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #ebf8ff; color: #2b6cb0; margin-bottom: 15px;}
    .escalated { border-left-color: #e53e3e; }
    .escalated .badge { background: #fff5f5; color: #c53030; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
   <nav class="officer-navbar">
  <div class="nav-brand">
    <h2>Smart Policing</h2>
    <span class="badge">Secure Officer Network</span>
  </div>
  
  <ul class="nav-links">
    <li><a href="central-dashboard.html">Central Dashboard</a></li>
    <li><a href="officer-dashboard.html">Officer Portal</a></li>
    <li><a href="traffic-dashboard.html">Traffic Control</a></li>
    <li><a href="ive-updates.html">Live Updates</a></li>
  </ul>

  <div class="nav-actions">
    <button id="logout-btn" class="logout-btn">Log Out</button>
  </div>
</nav>
</div>

  <div class="header">
    <h2><i class="fa-solid fa-building-shield"></i> Active Investigations Board</h2>
    <p>Live feed of citizen reports in the Omnagar jurisdiction.</p>
  </div>

  <div id="tickets-container">
    <p><i class="fa-solid fa-spinner fa-spin"></i> Fetching records from database...</p>
  </div>

  <script>
    async function fetchComplaints() {
      try {
        // Fetching directly from the same origin (no CORS block!)
        const response = await fetch('/api/complaints');
        const data = await response.json();
        
        const container = document.getElementById('tickets-container');
        container.innerHTML = ''; 

        // Handle different backend response structures
        const complaints = Array.isArray(data) ? data : (data.data || []);

        if (complaints.length === 0) {
          container.innerHTML = '<p>No active complaints at this time.</p>';
          return;
        }

        complaints.forEach(ticket => {
          // If the ticket has been escalated, change its styling
          const isEscalated = ticket.escalationLevel > 0;
          
          const div = document.createElement('div');
          div.className = `ticket ${isEscalated ? 'escalated' : ''}`;
          
          // Smart check for anonymity
          const isAnonymous = ticket.isAnonymous === true || ticket.isAnonymous === "true" || ticket.name === "Anonymous";
          
          const displayName = isAnonymous ? '<span style="color: #e53e3e; font-style: italic; font-weight: bold;">Anonymous</span>' : (ticket.name || ticket.complainantName || 'Not Provided');
          const displayPhone = isAnonymous ? '<span style="color: #e53e3e; font-style: italic; font-weight: bold;">Anonymous</span>' : (ticket.phone || ticket.contact || 'Not Provided');
          const displayAddress = isAnonymous ? '<span style="color: #e53e3e; font-style: italic; font-weight: bold;">Anonymous</span>' : (ticket.address || ticket.location || 'Not Provided');

          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
              <h3 style="margin: 0; color: #1a365d; font-size: 20px;">${ticket.category || ticket.title || ticket.incidentType || 'Citizen Report'}</h3>
            </div>
            
            <div class="badge" style="background: #ebf8ff; color: #2b6cb0; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 15px;">
              <i class="fa-solid fa-user-shield"></i> Assigned To: ${ticket.assignedTo || 'Level 0 Officer'}
            </div>
            
            <!-- Complainant Info Box (High contrast for visibility) -->
            <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #3b82f6; color: #334155;">
              <h4 style="margin: 0 0 10px 0; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">Complainant Details</h4>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; font-size: 14px;">
                <div><strong><i class="fa-solid fa-user"></i> Name:</strong> <br>${displayName}</div>
                <div><strong><i class="fa-solid fa-phone"></i> Phone:</strong> <br>${displayPhone}</div>
                <div><strong><i class="fa-solid fa-location-dot"></i> Address:</strong> <br>${displayAddress}</div>
              </div>
            </div>

            <!-- Incident Details Box -->
            <div style="background: #ffffff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px;">
              <h4 style="margin: 0 0 8px 0; color: #4a5568; font-size: 13px; text-transform: uppercase;">Incident Details</h4>
              <p style="margin: 0; font-size: 15px; color: #1e293b; line-height: 1.6; white-space: pre-wrap;">${ticket.description || 'No description provided.'}</p>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 12px;">
              <p style="font-size: 12px; color: #64748b; margin: 0; font-family: monospace;">Tracking ID: ${ticket._id}</p>
              <p style="font-size: 12px; color: #64748b; margin: 0;">Date: ${ticket.createdAt ? new Date(ticket.createdAt).toLocaleDateString() : 'N/A'}</p>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('tickets-container').innerHTML = '<p style="color: red;">Failed to load database records.</p>';
      }
    }

    // Run the function as soon as the page loads
    fetchComplaints();
  </script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Security Check
    const token = localStorage.getItem('token');
    
    if (!token) {
      alert("Unauthorized Access. Please log in first.");
      window.location.href = "/"; // Safely routes to your root login page
    }

    // 2. Logout Functionality (Now safely inside the load listener)
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token'); // Destroys the login token
        window.location.href = "/"; // Sends you back to the login screen
      });
    } else {
      console.error("Logout button not found on this page.");
    }
  });
</script>
</body>
</html>
