<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Officer Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding: 40px; color: #2d3748; }
    .header { margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    #tickets-container { display: grid; gap: 20px; }
    .ticket { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #3182ce; }
    .ticket h3 { margin: 0 0 10px 0; color: #1a365d; }
    .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #ebf8ff; color: #2b6cb0; margin-bottom: 15px;}
    .escalated { border-left-color: #e53e3e; }
    .escalated .badge { background: #fff5f5; color: #c53030; }
  </style>
</head>
<body>
    <!-- Secure Navigation Wrapper (Hidden by default) -->
<div id="secure-nav" style="display: none;">
    <nav style="background-color: #1a1e29; padding: 15px; border-bottom: 2px solid #333; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
        <a href="/central-dashboard.html" style="color: #4da6ff; text-decoration: none; font-weight: bold; padding: 5px;">Central Dashboard</a>
        <a href="/officer-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Officer Portal</a>
        <a href="/traffic-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Traffic Control</a>
        <a href="/transparency-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Transparency Stats</a>
        <a href="/citizen-complaint.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Complaints</a>
        <a href="/evidence-portal.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Evidence Portal</a>
        <a href="/services-portal.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Services</a>
    </nav>
</div>

  <div class="header">
    <h2><i class="fa-solid fa-building-shield"></i> Active Investigations Board</h2>
    <p>Live feed of citizen reports in the Omnagar jurisdiction.</p>
  </div>

  <div id="tickets-container">
    <p><i class="fa-solid fa-spinner fa-spin"></i> Fetching records from database...</p>
  </div>

  <script>
    async function fetchComplaints() {
      try {
        // Fetching directly from the same origin (no CORS block!)
        const response = await fetch('/api/complaints');
        const data = await response.json();
        
        const container = document.getElementById('tickets-container');
        container.innerHTML = ''; 

        // Handle different backend response structures
        const complaints = Array.isArray(data) ? data : (data.data || []);

        if (complaints.length === 0) {
          container.innerHTML = '<p>No active complaints at this time.</p>';
          return;
        }

        complaints.forEach(ticket => {
          // If the ticket has been escalated, change its styling
          const isEscalated = ticket.escalationLevel > 0;
          
          const div = document.createElement('div');
          div.className = `ticket ${isEscalated ? 'escalated' : ''}`;
          
          div.innerHTML = `
            <h3>${ticket.title || ticket.incidentType || 'Citizen Report'}</h3>
            <div class="badge"><i class="fa-solid fa-user-shield"></i> Assigned To: ${ticket.assignedTo || 'Level 0 Officer'}</div>
            <p><strong>Details:</strong> ${ticket.description}</p>
            <p style="font-size: 13px; color: #718096;">Tracking ID: ${ticket._id}</p>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('tickets-container').innerHTML = '<p style="color: red;">Failed to load database records.</p>';
      }
    }

    // Run the function as soon as the page loads
    fetchComplaints();
  </script>
  <script>
    // Check if the user is authenticated
    window.addEventListener('DOMContentLoaded', () => {
        const isLoggedIn = localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
        
        // If logged in, reveal the navigation bar
        if (isLoggedIn === 'true') {
            document.getElementById('secure-nav').style.display = 'block';
        }
    });
</script>
</body>
</html>
