<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Public Grievance Portal</title>
  <!-- Importing a modern font and professional icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      color: #2d3748;
    }

    /* Dynamic Hero Banner */
    .hero {
      background: rgba(16, 21, 32, 0.85);
      color: white;
      padding: 50px 20px 100px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hero h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: 1px; }
    .hero p { margin: 10px 0 0 0; color: #90cdf4; font-size: 16px; font-weight: 300; }
    .hero i { font-size: 40px; margin-bottom: 15px; color: #63b3ed; }

    /* Elevated Form Container */
    .container {
      max-width: 650px;
      margin: -60px auto 50px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 45px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-header h2 { margin: 0; color: #1a202c; font-size: 22px; }
    .form-header p { color: #718096; font-size: 14px; margin-top: 5px; }

    /* Anonymous Switch Container */
    .anonymous-box {
      background: #edf2f7;
      border: 2px dashed #cbd5e0;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .anonymous-box label {
      margin: 0;
      font-weight: 700;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Modern Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e0;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e53e3e;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .form-group { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 14px; }
    
    /* Input Fields with Embedded Icons */
    .input-with-icon {
      position: relative;
    }
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 15px;
      color: #a0aec0;
      font-size: 16px;
    }
    .input-with-icon input, .input-with-icon select {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
      background: #f7fafc;
    }
    .input-with-icon input:focus, .input-with-icon select:focus {
      border-color: #3182ce;
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
      background: #f7fafc;
      resize: vertical;
    }
    textarea:focus {
      border-color: #3182ce;
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    /* Modern Hover Button */
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(49, 130, 206, 0.4);
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(49, 130, 206, 0.6);
    }

    /* Redesigned Success Ticket */
    #success-box {
      display: none;
      background: #f0fff4;
      border: 2px solid #9ae6b4;
      border-left: 8px solid #38a169;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      animation: slideDown 0.5s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #success-box i.fa-circle-check {
      font-size: 48px;
      color: #38a169;
      margin-bottom: 15px;
    }
    .tracking-id {
      font-size: 28px;
      font-weight: 700;
      color: #276749;
      letter-spacing: 2px;
      margin: 15px 0;
      background: #c6f6d5;
      display: inline-block;
      padding: 10px 25px;
      border-radius: 8px;
    }
    .officer-details {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #e2e8f0;
      font-weight: 600;
      color: #2b6cb0;
    }
    .officer-details i { margin-right: 8px; }
  </style>
</head>
<body>

  <!-- Dynamic Header Banner -->
  <div class="hero">
    <i class="fa-solid fa-shield-halved"></i>
    <h1>OMNAGAR POLICE</h1>
    <p>Official Public Grievance & FIR Portal</p>
  </div>

  <div class="container">
    <div id="form-container">
      <div class="form-header">
        <h2>File a New Report</h2>
        <p>Your data is securely transmitted and encrypted.</p>
      </div>

      <!-- Stay Anonymous Toggle -->
      <div class="anonymous-box">
        <label for="anonymousToggle">
          <i class="fa-solid fa-user-ninja" style="color: #e53e3e;"></i>
          <span>Stay Anonymous</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="anonymousToggle">
          <span class="slider"></span>
        </label>
      </div>

      <form id="complaint-form">
        <div class="form-group" id="nameGroup">
          <label>Full Name</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="citizenName" required placeholder="Enter your full name">
          </div>
        </div>

        <div class="form-group" id="phoneGroup">
          <label>Mobile Number (For SMS Updates)</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-mobile-screen"></i>
            <input type="tel" id="phone" required placeholder="10-digit mobile number">
          </div>
        </div>

        <div class="form-group">
          <label>Incident Type</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-layer-group"></i>
            <select id="incidentType" required>
              <option value="" disabled selected>Select the category of your complaint...</option>
              <option value="Lost Item">Lost Item / Document</option>
              <option value="Cyber Crime">Cyber Crime / Online Fraud</option>
              <option value="Non-Cognizable">Non-Cognizable Offense (General Dispute)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Detailed Description</label>
          <textarea id="description" rows="5" required placeholder="Please provide the exact location, time, and specific details of the incident..."></textarea>
        </div>

        <button type="submit" id="submit-btn">
          <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Submit Complaint
        </button>
      </form>
    </div>

    <!-- Enhanced Success Ticket -->
    <div id="success-box">
      <i class="fa-solid fa-circle-check"></i>
      <h2 style="margin: 0; color: #276749;">Report Registered!</h2>
      <p style="color: #4a5568; margin-top: 5px;">Your complaint has been successfully logged.</p>
      
      <div class="tracking-id" id="display-tracking"></div>
      
      <div class="officer-details" id="display-officer">
        <i class="fa-solid fa-user-shield"></i> Investigating Officer: Pending Assignment
      </div>
      
      <p style="font-size: 13px; color: #718096; margin-top: 20px;">
        <i class="fa-solid fa-circle-info"></i> The 48-hour automated escalation timer has officially started.
      </p>
    </div>
  </div>

  <script>
    // Handle Anonymous Toggle Logic
    const anonymousToggle = document.getElementById('anonymousToggle');
    const citizenNameInput = document.getElementById('citizenName');
    const phoneInput = document.getElementById('phone');

    anonymousToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        citizenNameInput.value = 'Anonymous Citizen';
        phoneInput.value = '0000000000';
        citizenNameInput.readOnly = true;
        phoneInput.readOnly = true;
        citizenNameInput.style.backgroundColor = '#edf2f7';
        phoneInput.style.backgroundColor = '#edf2f7';
      } else {
        citizenNameInput.value = '';
        phoneInput.value = '';
        citizenNameInput.readOnly = false;
        phoneInput.readOnly = false;
        citizenNameInput.style.backgroundColor = '#f7fafc';
        phoneInput.style.backgroundColor = '#f7fafc';
      }
    });

    // Form Submission Logic
    document.getElementById('complaint-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Submitting...';
      submitBtn.style.opacity = '0.7';

      const payload = {
        citizenName: citizenNameInput.value,
        phone: phoneInput.value,
        incidentType: document.getElementById('incidentType').value,
        description: document.getElementById('description').value
      };

      try {
        const response = await fetch('/api/complaints/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('display-tracking').textContent = data._id || data.trackingId || 'TICKET-LOGGED';
          document.getElementById('display-officer').innerHTML = `<i class="fa-solid fa-user-shield"></i> Assigned to: IO (Level 0)`;
          document.getElementById('success-box').style.display = 'block';
        } else {
          alert('Server Error: ' + (data.message || 'Could not save to database.'));
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Submit Complaint';
          submitBtn.style.opacity = '1';
        }
      } catch (error) {
        console.error('Connection Error:', error);
        alert('Server connection failed. Check your terminal logs.');
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Submit Complaint';
        submitBtn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
