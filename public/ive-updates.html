<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Live City Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f172a; margin: 0; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .header { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; }
    .header h1 { margin: 0; font-size: 22px; color: #38bdf8; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .live-indicator { display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    @keyframes flash-bg { 0% { background-color: rgba(239, 68, 68, 0.1); } 50% { background-color: rgba(239, 68, 68, 0.4); } 100% { background-color: rgba(239, 68, 68, 0.1); } }

    .dashboard-container { display: flex; flex: 1; height: calc(100vh - 65px); }
    
    .alerts-panel { width: 380px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
    .alerts-panel h2 { margin-top: 0; font-size: 16px; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .alert-card { background: #0f172a; border-left: 4px solid #3b82f6; padding: 15px; margin-bottom: 15px; border-radius: 4px 8px 8px 4px; transition: all 0.5s ease; }
    .alert-card.high { border-left-color: #ef4444; animation: flash-bg 2s infinite; }
    .alert-card.vip { border-left-color: #a855f7; }
    .alert-card.medium { border-left-color: #f59e0b; }
    
    .alert-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: bold; }
    .alert-message { font-size: 14px; line-height: 1.5; color: #e2e8f0; }

    .map-panel { flex: 1; position: relative; }
    #city-map { width: 100%; height: 100%; background: #000; }
    
    .map-overlay { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(15, 23, 42, 0.85); padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .pcr-marker { background: #3b82f6; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 0 10px #3b82f6; font-size: 10px; font-weight: bold;}
    .incident-marker { background: #ef4444; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 0 20px #ef4444; font-size: 16px; animation: blink 1s infinite; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="officer-navbar">
    <div class="nav-brand">
      <h2>Smart Policing</h2>
      <span class="badge">Secure Officer Network</span>
    </div>
    <ul class="nav-links">
      <li><a href="central-dashboard.html">Central Dashboard</a></li>
      <li><a href="officer-dashboard.html">Officer Portal</a></li>
      <li><a href="traffic-dashboard.html">Traffic Control</a></li>
      <li><a href="ive-updates.html">Live Updates</a></li>
    </ul>
    <div class="nav-actions">
      <button id="logout-btn" class="logout-btn">Log Out</button>
    </div>
  </nav>

  <div class="header">
    <h1><i class="fa-solid fa-satellite"></i> OMNAGAR POLICE COMMAND</h1>
    <div style="font-size: 14px; font-weight: bold; color: #ef4444; display: flex; align-items: center; gap: 8px;">
      <span class="live-indicator"></span> JAMSHEDPUR LIVE RADAR
    </div>
  </div>

  <div class="dashboard-container">
    <div class="alerts-panel">
      <h2>
        <span><i class="fa-solid fa-list-ul"></i> Command Feed</span>
        <span style="font-size: 11px; color: #10b981;"><i class="fa-solid fa-circle-check"></i> System Secure</span>
      </h2>
      <div id="alerts-container"></div>
    </div>

    <div class="map-panel">
      <div class="map-overlay">
        <strong style="color: #38bdf8;">District:</strong> East Singhbhum<br>
        <strong style="color: #10b981;">Active PCR Units:</strong> 27<br>
        <strong style="color: #f59e0b;">Status:</strong> Monitoring all zones
      </div>
      <div id="city-map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. INITIALIZE WIDER JAMSHEDPUR MAP (Zoom 12 to see Kandra down to Govindpur)
    const map = L.map('city-map', { zoomControl: false }).setView([22.8000, 86.1900], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    // 2. CITY-WIDE LOCATIONS DICTIONARY
    const locations = {
      "Sakchi": [22.8050, 86.2050], "Bistupur": [22.8000, 86.1800], "Golmuri": [22.7950, 86.2200],
      "Sidhgora": [22.8050, 86.2300], "Northern Town": [22.8100, 86.1850], "Dhatkidih": [22.8050, 86.1900],
      "Eastern Jamshedpur": [22.7850, 86.2400], "Telco Colony": [22.7750, 86.2400], "Birsanagar": [22.7800, 86.2500],
      "Baridih": [22.7900, 86.2400], "Nildih": [22.7850, 86.2300], "Govindpur": [22.7600, 86.2600],
      "Moharda": [22.7950, 86.2550], "Ghorabandha": [22.7700, 86.2700], "Western Jamshedpur": [22.8150, 86.1500],
      "Sonari": [22.8250, 86.1750], "Kadma": [22.8150, 86.1650], "Southern Jamshedpur": [22.7650, 86.1950],
      "Jugsalai": [22.7850, 86.1850], "Gadhra": [22.7650, 86.2000], "Parsudih": [22.7700, 86.1950],
      "Mango": [22.8350, 86.2100], "Adityapur": [22.7950, 86.1600], "Gamharia": [22.8250, 86.1200],
      "Kandra": [22.8500, 86.0800], "Bhalubasa": [22.8100, 86.2150], "Kapali": [22.8450, 86.1900]
    };
    const locationNames = Object.keys(locations);

    // 3. GENERATE CITY-WIDE PCR FLEET
    const pcrIcon = L.divIcon({ html: '<div class="pcr-marker"><i class="fa-solid fa-car-side"></i></div>', className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
    const fleet = [];
    
    let pcrIndex = 1;
    for (const [zone, coords] of Object.entries(locations)) {
      const pcr = { id: `PCR-${pcrIndex}`, zone: zone, lat: coords[0], lng: coords[1], m: null };
      pcr.m = L.marker([pcr.lat, pcr.lng], {icon: pcrIcon}).addTo(map)
        .bindPopup(`<strong style="color:#2563eb;">${pcr.id}</strong><br>Zone: ${pcr.zone}<br>Status: On Patrol`);
      fleet.push(pcr);
      pcrIndex++;
    }

    // Make all 27 PCRs drive around slightly
    setInterval(() => {
      fleet.forEach(pcr => {
        pcr.lat += (Math.random() - 0.5) * 0.0006;
        pcr.lng += (Math.random() - 0.5) * 0.0006;
        pcr.m.setLatLng([pcr.lat, pcr.lng]);
      });
    }, 2000);

    // 4. INFINITE DYNAMIC EVENT GENERATOR
    const incidentIcon = L.divIcon({ html: '<div class="incident-marker"><i class="fa-solid fa-triangle-exclamation"></i></div>', className: '', iconSize: [35, 35], iconAnchor: [17, 17] });
    let activeIncidentMarker = null;

    const vips = ["Prime Minister", "Chief Minister", "Governor", "President of India", "DGP Jharkhand", "Chief Justice"];
    const incidents = [
      { name: "Code Red", desc: "Shots fired reported", class: "high", icon: "fa-gun" },
      { name: "Emergency", desc: "Major fire broke out", class: "high", icon: "fa-fire" },
      { name: "Disturbance", desc: "Violent altercation on main road", class: "high", icon: "fa-hand-fist" },
      { name: "Traffic Update", desc: "Severe multi-vehicle collision", class: "medium", icon: "fa-car-burst" },
      { name: "Security Alert", desc: "Suspicious package reported", class: "high", icon: "fa-bomb" },
      { name: "Crime Alert", desc: "Armed robbery in progress", class: "high", icon: "fa-mask" }
    ];

    function getRandomLocation() {
      return locationNames[Math.floor(Math.random() * locationNames.length)];
    }

    const container = document.getElementById('alerts-container');

    function generateNextEvent() {
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      const isVip = Math.random() > 0.6; // 40% chance VIP, 60% chance Incident
      let eventHTML = "";
      
      if (isVip) {
        const vip = vips[Math.floor(Math.random() * vips.length)];
        const from = getRandomLocation();
        let to = getRandomLocation();
        while (to === from) to = getRandomLocation(); // Ensure they aren't the same
        
        eventHTML = `
          <div class="alert-card vip">
            <div class="alert-header">
              <span style="color: #a855f7;"><i class="fa-solid fa-star"></i> VIP Movement</span>
              <span>${time}</span>
            </div>
            <div class="alert-message">${vip} convoy moving from ${from} to ${to}. Green corridor active.</div>
          </div>`;
      } else {
        const incident = incidents[Math.floor(Math.random() * incidents.length)];
        const locName = getRandomLocation();
        const coords = locations[locName];
        
        eventHTML = `
          <div class="alert-card ${incident.class}">
            <div class="alert-header">
              <span style="color: ${incident.class === 'high' ? '#ef4444' : '#f59e0b'};">
                <i class="fa-solid ${incident.icon}"></i> ${incident.name}
              </span>
              <span>${time}</span>
            </div>
            <div class="alert-message">${incident.desc} in ${locName}. PCR units dispatched.</div>
          </div>`;

        // Map movement for incidents
        if (activeIncidentMarker) map.removeLayer(activeIncidentMarker);
        activeIncidentMarker = L.marker([coords[0], coords[1]], {icon: incidentIcon}).addTo(map)
          .bindPopup(`<b>${incident.name}</b><br>${incident.desc} in ${locName}`).openPopup();
        map.flyTo([coords[0], coords[1]], 14, { animate: true, duration: 1.5 });
      }

      // Add to sidebar
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = eventHTML;
      container.prepend(tempDiv.firstElementChild);

      // Keep only the last 10 alerts in the sidebar so it doesn't crash the browser
      if (container.children.length > 10) {
        container.removeChild(container.lastChild);
      }
    }

    // Fire the first event immediately, then a new random one every 9 seconds
    generateNextEvent();
    setInterval(generateNextEvent, 9000);
  </script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('token');
          window.location.href = '/index.html';
        });
      }
    });
  </script>
</body>
</html>
