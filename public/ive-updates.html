<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Live City Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Leaflet CSS for the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f172a; margin: 0; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Tactical Header */
    .header { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; }
    .header h1 { margin: 0; font-size: 22px; color: #38bdf8; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .live-indicator { display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Main Dashboard Layout */
    .dashboard-container { display: flex; flex: 1; height: calc(100vh - 65px); }
    
    /* Left Sidebar: Live Alerts */
    .alerts-panel { width: 350px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
    .alerts-panel h2 { margin-top: 0; font-size: 16px; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    
    .alert-card { background: #0f172a; border-left: 4px solid #3b82f6; padding: 15px; margin-bottom: 15px; border-radius: 4px 8px 8px 4px; }
    .alert-card.high { border-left-color: #ef4444; }
    .alert-card.medium { border-left-color: #f59e0b; }
    
    .alert-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #94a3b8; font-weight: bold; }
    .alert-message { font-size: 14px; line-height: 1.5; color: #e2e8f0; }

    /* Right Area: The Interactive Map */
    .map-panel { flex: 1; position: relative; }
    #city-map { width: 100%; height: 100%; background: #000; }
    
    /* Overlay UI on map */
    .map-overlay { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(15, 23, 42, 0.8); padding: 10px 20px; border-radius: 8px; border: 1px solid #334155; backdrop-filter: blur(5px); }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="officer-navbar">
  <div class="nav-brand">
    <h2>Smart Policing</h2>
    <span class="badge">Secure Officer Network</span>
  </div>
  
  <ul class="nav-links">
    <li><a href="central-dashboard.html">Central Dashboard</a></li>
    <li><a href="officer-dashboard.html">Officer Portal</a></li>
    <li><a href="traffic-dashboard.html">Traffic Control</a></li>
    <li><a href="ive-updates.html">Live Updates</a></li>
  </ul>

  <div class="nav-actions">
    <button id="logout-btn" class="logout-btn">Log Out</button>
  </div>
</nav>
</div>

  <div class="header">
    <h1><i class="fa-solid fa-satellite"></i> OMNAGAR POLICE COMMAND</h1>
    <div style="font-size: 14px; font-weight: bold; color: #ef4444;">
      <span class="live-indicator"></span> LIVE SECURE FEED
    </div>
  </div>

  <div class="dashboard-container">
    <!-- Left Panel for Alerts -->
    <div class="alerts-panel">
      <h2><i class="fa-solid fa-list-ul"></i> Active Advisories</h2>
      <div id="alerts-container">
        <p style="color: #64748b; font-size: 14px;"><i class="fa-solid fa-spinner fa-spin"></i> Establishing secure connection...</p>
      </div>
    </div>

    <!-- Right Panel for Map -->
    <div class="map-panel">
      <div class="map-overlay">
        <strong>Radar Status:</strong> Online | <strong>City Sector:</strong> Alpha
      </div>
      <div id="city-map"></div>
    </div>
  </div>

  <!-- Leaflet JS for the map -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Initialize the Interactive Map (Centered on Omnagar/Jamshedpur coordinates)
    const map = L.map('city-map').setView([22.8046, 86.2029], 14);

    // Add Dark Mode CartoDB Map Tiles (Free, no API key needed)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Custom Icons for Map Markers
    const accidentIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });
    
    const hazardIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    // 2. Fetch and Plot Map Data
    async function loadMapData() {
      try {
        const res = await fetch('/api/updates/map-data');
        const incidents = await res.json();
        
        incidents.forEach(incident => {
          const iconToUse = incident.type === 'accident' ? accidentIcon : hazardIcon;
          L.marker([incident.lat, incident.lng], { icon: iconToUse })
            .addTo(map)
            .bindPopup(`<b>${incident.title}</b><br>Dispatch notified.`);
        });
      } catch (e) { console.error("Map data failed to load."); }
    }

    // 3. Fetch and Render Live Alerts
    async function loadAlerts() {
      try {
        const res = await fetch('/api/updates/alerts');
        const alerts = await res.json();
        const container = document.getElementById('alerts-container');
        container.innerHTML = ''; // Clear loading text
        
        alerts.forEach(alert => {
          let icon = 'fa-circle-info';
          if(alert.type === 'Traffic') icon = 'fa-car-burst';
          if(alert.type === 'Security') icon = 'fa-shield-halved';
          if(alert.type === 'Weather') icon = 'fa-cloud-bolt';
          
          container.innerHTML += `
            <div class="alert-card ${alert.severity}">
              <div class="alert-header">
                <span><i class="fa-solid ${icon}"></i> ${alert.type}</span>
                <span>${alert.time}</span>
              </div>
              <div class="alert-message">${alert.message}</div>
            </div>
          `;
        });
      } catch (e) { console.error("Alerts failed to load."); }
    }

    // Run functions on load
    loadMapData();
    loadAlerts();
  </script>
  <script>
    function handleLogout() {
        // Clear the token and login flag
        localStorage.removeItem('token');
        localStorage.removeItem('isLoggedIn');
        
        // Redirect back to the login page
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
