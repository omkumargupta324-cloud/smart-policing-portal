<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Emergency SOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Socket.io Client Script -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .sos-container { background: #1e293b; padding: 40px 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(225, 29, 72, 0.3); border: 1px solid rgba(225, 29, 72, 0.4); max-width: 420px; width: 90%; }
    .sos-btn { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, #e11d48, #9f1239); color: white; font-size: 28px; font-weight: 800; border: 6px solid #fecdd3; cursor: pointer; box-shadow: 0 0 25px rgba(225, 29, 72, 0.6); transition: all 0.2s ease-in-out; margin: 25px 0; outline: none; }
    .sos-btn:active { transform: scale(0.92); box-shadow: 0 0 10px rgba(225, 29, 72, 0.8); }
    .status-box { margin-top: 15px; font-size: 14px; font-weight: 600; color: #94a3b8; }
    .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    .back-link { display: inline-block; margin-top: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="sos-container">
    <h1 style="color: #f43f5e; margin: 0;"><i class="fa-solid fa-triangle-exclamation"></i> EMERGENCY SOS</h1>
    <p style="color: #94a3b8; font-size: 13px;">Pressing this button will instantly dispatch your location to the Omnagar Police Command Center.</p>

    <input type="text" id="citizen-name" class="input-field" placeholder="Your Name (Optional)">
    <input type="text" id="citizen-phone" class="input-field" placeholder="Phone Number (Optional)">

    <button class="sos-btn" id="panic-btn" onclick="sendSOS()">
      <i class="fa-solid fa-bell-concierge"></i><br>SOS
    </button>

    <div class="status-box" id="status-msg">Click SOS for immediate response.</div>
    <a href="/index.html" class="back-link">← Return to Portal</a>
  </div>

  <script>
    const socket = io();
    let userLocation = "Location not permitted";

    // Auto-fetch GPS Location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLocation = `Lat: ${position.coords.latitude.toFixed(4)}, Long: ${position.coords.longitude.toFixed(4)}`;
        },
        () => { userLocation = "GPS Location Unavailable"; }
      );
    }
async function sendSOS() {
  const name = document.getElementById('citizen-name').value || "Anonymous Citizen";
  const phone = document.getElementById('citizen-phone').value || "Not Provided";
  const btn = document.getElementById('panic-btn');
  const statusMsg = document.getElementById('status-msg');

  btn.style.background = "#22c55e";
  btn.style.borderColor = "#4bef7d";
  btn.innerHTML = `<i class="fa-solid fa-check"></i><br>SENT`;

  statusMsg.style.color = "#4ade80";
  statusMsg.innerHTML = "🚨 Emergency Broadcast Sent! Police Dispatched.";

  const payload = {
    name,
    phone,
    location: userLocation,
    timestamp: new Date().toISOString()
  };

  // 1. Emit live WebSocket signal to police dashboard
  socket.emit('trigger-sos', payload);

  // 2. Save emergency log to MongoDB database
  try {
    await fetch('/api/emergency/sos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.error('Failed to log SOS to database:', err);
  }

  setTimeout(() => {
    btn.style.background = "linear-gradient(135deg, #e11d48, #9f1239)";
    btn.style.borderColor = "#fecdd3";
    btn.innerHTML = `<i class="fa-solid fa-bell-concierge"></i><br>SOS`;
  }, 5000);
}
      </script>
</body>
</html>
