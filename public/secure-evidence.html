<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Secure Evidence Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .form-container { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin-top: 0; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #94a3b8; font-weight: 600; }
    input[type="text"], textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit; box-sizing: border-box; }
    input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #38bdf8; border-radius: 6px; color: #cbd5e1; cursor: pointer; }
    .submit-btn { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .submit-btn:hover { background: #0284c7; color: white; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; }
    .status-msg { text-align: center; margin-top: 15px; font-size: 14px; font-weight: 600; display: none; }
    
    #imagePreview { max-width: 100%; margin-top: 10px; border-radius: 8px; display: none; border: 1px solid #334155; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2><i class="fa-solid fa-file-shield"></i> Secure Evidence Portal</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-bottom: 25px;">Upload photos, documents, or footage directly to the investigating officer's dashboard.</p>

    <form id="evidenceForm">
      <div class="form-group">
        <label>Case / FIR Reference Number *</label>
        <input type="text" id="caseReference" required placeholder="e.g., FIR-2026-089">
      </div>

      <div class="form-group">
        <label>Evidence Title *</label>
        <input type="text" id="title" required placeholder="e.g., Dashcam footage of hit & run">
      </div>

      <div class="form-group">
        <label>Brief Description</label>
        <textarea id="description" rows="3" placeholder="Provide context about what this file shows..."></textarea>
      </div>

      <div class="form-group">
        <label>Select File (Image / Document) *</label>
        <input type="file" id="evidenceFile" accept="image/*,application/pdf" required onchange="previewImage(event)">
        <img id="imagePreview" alt="Image Preview">
      </div>

      <button type="submit" class="submit-btn">Securely Upload File</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <a href="/index.html" class="back-link">← Return to Portal</a>
  </div>

  <script>
    function previewImage(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('imagePreview');
      if (file && file.type.startsWith('image/')) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    document.getElementById('evidenceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.querySelector('.submit-btn');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
      
      const formData = new FormData();
      formData.append('caseReference', document.getElementById('caseReference').value);
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('evidenceFile', document.getElementById('evidenceFile').files[0]);

      try {
        const response = await fetch('/api/evidence/upload', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          statusMsg.style.color = '#4ade80';
          statusMsg.innerHTML = '<i class="fa-solid fa-circle-check"></i> File successfully uploaded and secured.';
          statusMsg.style.display = 'block';
          document.getElementById('evidenceForm').reset();
          document.getElementById('imagePreview').style.display = 'none';
        } else {
          throw new Error('Upload failed');
        }
      } catch (error) {
        statusMsg.style.color = '#f87171';
        statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error uploading file. Please try again.';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Securely Upload File';
      }
    });
  </script>
</body>
</html>
