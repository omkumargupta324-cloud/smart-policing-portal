    <h1>City Command - FIR Registry</h1>

  <div class="container">
    <h2>File New FIR</h2>
    <form id="fir-form">
      <div class="form-group">

        <textarea id="description" rows="5" required placeholder="Provide detailed report of the incident..."></textarea>

    <!-- FIR Display Container -->
<div class="fir-section" style="margin-top: 30px;">
  <h2>Filed FIR Database</h2>
  <div id="fir-list-container">
    <p style="color: #a0aec0;">Loading FIR records...</p>
  </div>
</div>
  </div>

  <script>
    // Security Check
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/';
    }

    // Logout Function

  </script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    
    // If no token is found, kick them to the login page immediately
    if (!token) {
      alert("Unauthorized Access. Please log in first.");
      window.location.href = "index.html"; 
    }
  });

  // Logout Functionality
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = "index.html"; 
    });
  }
</script>
<!-- Socket.io Library -->
<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  // Listen for live SOS broadcasts
  socket.on('sos-alert', (data) => {
    // Play alert sound or pop alert box
    const alertBox = document.createElement('div');
    alertBox.style.cssText = `
      position: fixed; top: 20px; right: 20px; background: #dc2626; color: white;
      padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 99999; border: 2px solid #fca5a5; max-width: 350px; font-family: sans-serif;
      animation: pulse 1s infinite alternate;
    `;
    alertBox.innerHTML = `
      <h3 style="margin:0 0 5px 0; font-size: 18px;">🚨 CRITICAL EMERGENCY SOS!</h3>
      <p style="margin:3px 0;"><strong>Citizen:</strong> ${data.name}</p>
      <p style="margin:3px 0;"><strong>Phone:</strong> ${data.phone}</p>
      <p style="margin:3px 0;"><strong>GPS:</strong> ${data.location}</p>
      <p style="margin:3px 0; font-size:11px; opacity:0.8;">Time: ${data.timestamp}</p>
      <button onclick="this.parentElement.remove()" style="margin-top:10px; background:white; color:black; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer;">Acknowledge & Dismiss</button>
    `;
    document.body.appendChild(alertBox);
  });
</script>
<script>
  document.getElementById('fir-form').addEventListener('submit', async (e) => {
    e.preventDefault(); // Stops the page from refreshing

    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.textContent = 'Filing...';

    const payload = {
      caseNumber: document.getElementById('caseNumber').value,
      description: document.getElementById('description').value,
      status: 'Open' 
    };

    try {
      // NOTE: If your FIR route is named something else (like /api/firs/create), change the URL below!
      const res = await fetch('/api/fir/file', { 
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('✅ FIR Filed Successfully and Saved to Database!');
        document.getElementById('fir-form').reset();
      } else {
        const errorData = await res.json();
        alert('❌ Error: ' + (errorData.error || 'Failed to file FIR.'));
      }
    } catch (error) {
      console.error(error);
      alert('Server error. Could not connect to database.');
    } finally {
      submitBtn.textContent = 'File Report';
    }
  });
</script>
<script>
  async function fetchAndDisplayFIRs() {
    const container = document.getElementById('fir-list-container');
    if (!container) return;

    try {
      const token = localStorage.getItem('token');

      const res = await fetch('/api/fir/all', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      const firs = await res.json();

      if (!res.ok) {
        container.innerHTML = `<p style="color: #fc8181;">Error loading FIRs: ${firs.error || firs.message}</p>`;
        return;
      }

      if (!firs || firs.length === 0) {
        container.innerHTML = '<p style="color: #a0aec0;">No FIR records found in the database.</p>';
        return;
      }

      container.innerHTML = firs.map(fir => `
        <div style="background: rgba(255, 255, 255, 0.05); padding: 15px; margin-bottom: 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1);">
          <h4 style="margin: 0 0 8px 0; color: #63b3ed;">Case #: ${fir.caseNumber}</h4>
          <p style="margin: 0 0 8px 0; color: #e2e8f0;">${fir.description}</p>
          <span style="font-size: 12px; background: #2b6cb0; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold;">
            Status: ${fir.status || 'Open'}
          </span>
        </div>
      `).join('');

    } catch (err) {
      console.error(err);
      container.innerHTML = '<p style="color: #fc8181;">Server connection failed. Could not fetch FIRs.</p>';
    }
  }

  window.addEventListener('DOMContentLoaded', fetchAndDisplayFIRs);
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Security Check
    const token = localStorage.getItem('token');
    
    if (!token) {
      alert("Unauthorized Access. Please log in first.");
      window.location.href = "/"; // Safely routes to your root login page
    }

    // 2. Logout Functionality (Now safely inside the load listener)
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token'); // Destroys the login token
        window.location.href = "/"; // Sends you back to the login screen
      });
    } else {
      console.error("Logout button not found on this page.");
    }
  });
</script>
</body>
