<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Command | Omnagar Police</title>
  <style>
    /* We use the exact same CSS structure as the Traffic board for consistency */
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #101520; color: #e2e8f0; margin: 0; }
    .navbar { background: linear-gradient(135deg, #1a365d 0%, #101520 100%); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .navbar h1 { margin: 0; font-size: 20px; color: #fff; text-transform: uppercase; }
    .logout-btn { background: transparent; color: #e53e3e; border: 1px solid #e53e3e; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #e53e3e; color: #fff; }
    .container { max-width: 800px; margin: 40px auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #a0aec0; }
    input, textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #4a5568; background: #1a202c; color: #fff; box-sizing: border-box; }
    button.submit-btn { background: #2c5282; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button.submit-btn:hover { background: #3182ce; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
<!-- Secure Navigation Wrapper (Hidden by default) -->
<div id="secure-nav" style="display: none;">
    <nav style="background-color: #1a1e29; padding: 15px; border-bottom: 2px solid #333; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
        <a href="/central-dashboard.html" style="color: #4da6ff; text-decoration: none; font-weight: bold; padding: 5px;">Central Dashboard</a>
        <a href="/officer-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Officer Portal</a>
        <a href="/traffic-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Traffic Control</a>
        <a href="/transparency-dashboard.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Transparency Stats</a>
        <a href="/citizen-complaint.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Complaints</a>
        <a href="/evidence-portal.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Evidence Portal</a>
        <a href="/services-portal.html" style="color: white; text-decoration: none; font-weight: bold; padding: 5px;">Services</a>
    </nav>
</div>

  <nav class="navbar">
    <h1>City Command - FIR Registry</h1>
    <button onclick="handleLogout()" class="your-existing-classes-if-any">Logout</button>
  </nav>

  <div class="container">
    <h2>File New FIR</h2>
    <form id="fir-form">
      <div class="form-group">
        <label>Case Number</label>
        <input type="text" id="caseNumber" required placeholder="e.g. FIR-2026-001">
      </div>
      <div class="form-group">
        <label>Incident Description</label>
        <textarea id="description" rows="5" required placeholder="Provide detailed report of the incident..."></textarea>
      </div>
      <button type="submit" class="submit-btn">File Report</button>
    </form>
  </div>

  <script>
    // Security Check
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/';
    }

    // Logout Function
    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/';
    }
  </script>
  <script>
    // Check if the user is authenticated
    window.addEventListener('DOMContentLoaded', () => {
        const isLoggedIn = localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
        
        // If logged in, reveal the navigation bar
        if (isLoggedIn === 'true') {
            document.getElementById('secure-nav').style.display = 'block';
        }
    });
</script>
  <script>
    // This checks if you are logged in and shows the navigation bar
    if (localStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('secure-nav').style.display = 'block';
    }

    // This handles logging out cleanly
    function handleLogout() {
        localStorage.removeItem('token');
        localStorage.removeItem('isLoggedIn');
        window.location.href = '/index.html';
    }
</script>

</body>
</html>
