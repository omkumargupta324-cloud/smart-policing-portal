<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnagar Police | Smart Policing Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .portal-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 440px;
      border: 1px solid #334155;
      text-align: center;
    }
    .badge-header {
      font-size: 40px;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 5px 0;
      color: #f1f5f9;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-family: inherit;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .login-btn:hover {
      background: #0369a1;
    }
    .divider {
      margin: 25px 0 20px 0;
      border-top: 1px solid #334155;
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      padding: 0 10px;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .extra-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .public-btn {
      display: block;
      padding: 10px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .public-btn:hover {
      border-color: #38bdf8;
      background: #1e293b;
    }
    .sos-btn {
      display: block;
      padding: 12px;
      background: #dc2626;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .sos-btn:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="badge-header">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1>OMNAGAR POLICE</h1>
    <p class="subtitle">Official Command & Citizen Services Portal</p>

    <!-- Officer Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label>Officer ID / Username</label>
        <input type="text" id="username" placeholder="Enter Police ID" required>
      </div>
      <div class="form-group">
        <label>Passcode</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn">Officer Login</button>
    </form>

    <div class="divider">
      <span>Public Services</span>
    </div>

    <!-- Citizen Direct Access Links (No Login Required) -->
    <div class="extra-links">
      <a href="/citizen-complaint.html" class="public-btn">📢 File Public Complaint / FIR</a>
      <a href="/report-missing.html" class="public-btn" style="color: #fbbf24 !important;">📝 Report Missing Person</a>
      <a href="/wanted-missing.html" class="public-btn" style="color: #a78bfa !important;">👀 View Missing & Wanted Database</a>
      <a href="/secure-evidence.html" class="public-btn" style="color: #38bdf8 !important;">🛡️ Secure Evidence Upload</a>
      <a href="/sos-panic.html" class="sos-btn">🚨 EMERGENCY SOS / PANIC</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/central-dashboard.html';
        } else {
          alert(data.error || 'Login failed');
        }
      } catch (err) {
        alert('Server connection error');
      }
    });
  </script>
</body>
</html>
